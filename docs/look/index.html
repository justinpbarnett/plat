<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UML Board Looks</title>
<style>
@font-face { font-family: "Routed Gothic"; src: url(fonts/routed-gothic.woff2) format("woff2"); font-weight: 400; font-display: block; }
@font-face { font-family: "JetBrains Mono"; src: url(../../plat/board/fonts/jbm-Regular.woff2) format("woff2"); font-weight: 400; font-display: block; }
@font-face { font-family: "JetBrains Mono"; src: url(../../plat/board/fonts/jbm-Bold.woff2) format("woff2"); font-weight: 700; font-display: block; }

body[data-look="a"] {
  --bg: #ffffff; --ink: #000000; --muted: #555555; --line: #000000; --box: #ffffff; --head: #ffffff;
  --pkg: #ffffff; --tab: #ffffff; --tab-ink: #000000; --hollow: #ffffff; --lit: #000000; --sel: #000000;
  --sel-w: 3; --lit-w: 2; --dim: 0.2; --panel: #ffffff; --panel-line: #000000; --chip: none;
  --name-font: Helvetica, Arial, sans-serif; --name-weight: 700; --name-tt: none; --name-ls: 0; --name-size: 14px; --name-fill: #000000;
  --mem-font: ui-monospace, Menlo, Consolas, monospace; --mem-size: 11px; --mem-fill: #000000;
  --tab-font: Helvetica, Arial, sans-serif; --tab-size: 13px; --tab-ls: 0; --tab-tt: none; --tab-weight: 700;
  --ui-font: Helvetica, Arial, sans-serif; --btn-on-bg: #000000; --btn-on-ink: #ffffff; --edge-w: 1; --box-w: 1;
  --pkg-stroke: #000000; --box-stroke: #000000; --head-band: transparent; --pkg-dash: none;
}
@media (prefers-color-scheme: dark) {
  body[data-look="a"] {
    --bg: #111111; --ink: #ffffff; --muted: #aaaaaa; --line: #ffffff; --box: #111111; --head: #111111;
    --pkg: #111111; --tab: #111111; --tab-ink: #ffffff; --hollow: #111111; --lit: #ffffff; --sel: #ffffff;
    --panel: #111111; --panel-line: #ffffff; --name-fill: #ffffff; --mem-fill: #ffffff;
    --btn-on-bg: #ffffff; --btn-on-ink: #111111; --pkg-stroke: #ffffff; --box-stroke: #ffffff;
  }
}
body[data-look="b"] {
  --bg: #0B0C0E; --ink: #E7E5DF; --muted: #9C9A93; --line: #E7E5DF; --box: #000000; --head: #000000;
  --pkg: #0B0C0E; --tab: #E7E5DF; --tab-ink: #0B0C0E; --hollow: #0B0C0E; --lit: #E7E5DF; --sel: #FFD60A;
  --sel-w: 2; --lit-w: 1.6; --dim: 0.18; --panel: #0B0C0E; --panel-line: #2B2C31; --chip: none;
  --name-font: "Routed Gothic", "DIN Alternate", "Arial Narrow", sans-serif; --name-weight: 400; --name-tt: uppercase; --name-ls: 0.1em; --name-size: 15px; --name-fill: #ffffff;
  --mem-font: "JetBrains Mono", ui-monospace, monospace; --mem-size: 11px; --mem-fill: #E7E5DF;
  --tab-font: "Routed Gothic", "DIN Alternate", "Arial Narrow", sans-serif; --tab-size: 14px; --tab-ls: 0.14em; --tab-tt: uppercase; --tab-weight: 400;
  --ui-font: "JetBrains Mono", ui-monospace, monospace; --btn-on-bg: #E7E5DF; --btn-on-ink: #0B0C0E; --edge-w: 1; --box-w: 1;
  --pkg-stroke: #E7E5DF; --box-stroke: #4A4C52; --head-band: transparent; --pkg-dash: none;
}
body[data-look="c"] {
  --bg: #0B0C0E; --ink: #E7E5DF; --muted: #9C9A93; --line: #6E727A; --box: #121418; --head: #1A1D22;
  --pkg: #0E1013; --tab: #121418; --tab-ink: #9C9A93; --hollow: #0B0C0E; --lit: #FFD60A; --sel: #FFD60A;
  --sel-w: 2; --lit-w: 1.4; --dim: 0.22; --panel: #121418; --panel-line: #2B2C31; --chip: inline;
  --name-font: "IBM Plex Sans", system-ui, -apple-system, sans-serif; --name-weight: 600; --name-tt: none; --name-ls: 0; --name-size: 13px; --name-fill: #E7E5DF;
  --mem-font: "JetBrains Mono", ui-monospace, monospace; --mem-size: 11px; --mem-fill: #BDBBB4;
  --tab-font: "JetBrains Mono", ui-monospace, monospace; --tab-size: 11px; --tab-ls: 0.06em; --tab-tt: uppercase; --tab-weight: 400;
  --ui-font: "JetBrains Mono", ui-monospace, monospace; --btn-on-bg: #21252B; --btn-on-ink: #E7E5DF; --edge-w: 1; --box-w: 1;
  --pkg-stroke: #2B2C31; --box-stroke: #2B2C31; --head-band: #1A1D22; --pkg-dash: 4 3;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
body { font-family: var(--ui-font); font-size: 12px; }
#board { position: fixed; inset: 0 0 28px 0; width: 100%; height: calc(100% - 28px); display: block; cursor: grab; background: var(--bg); touch-action: none; }
#board.drag { cursor: grabbing; }

.pkg-body { fill: var(--pkg); stroke: var(--pkg-stroke); stroke-width: 1; stroke-dasharray: var(--pkg-dash); }
.pkg-tab { fill: var(--tab); stroke: var(--pkg-stroke); stroke-width: 1; stroke-dasharray: none; }
.pkg-title { font-family: var(--tab-font); font-size: var(--tab-size); letter-spacing: var(--tab-ls); text-transform: var(--tab-tt); font-weight: var(--tab-weight); fill: var(--tab-ink); }
.pkg-big { font-family: var(--tab-font); font-size: 46px; letter-spacing: var(--tab-ls); text-transform: var(--tab-tt); font-weight: var(--tab-weight); fill: var(--ink); text-anchor: middle; display: none; }
.pkg-sub { font-family: var(--mem-font); font-size: 22px; fill: var(--muted); text-anchor: middle; display: none; }

.box { fill: var(--box); stroke: var(--box-stroke); stroke-width: var(--box-w); }
.band { fill: var(--head-band); }
.divider { stroke: var(--box-stroke); stroke-width: 1; }
body[data-look="b"] .divider { stroke: #4A4C52; }
.cname { font-family: var(--name-font); font-weight: var(--name-weight); text-transform: var(--name-tt); letter-spacing: var(--name-ls); font-size: var(--name-size); fill: var(--name-fill); text-anchor: middle; }
.chip { font-family: var(--mem-font); font-size: 9px; fill: var(--muted); text-anchor: end; text-transform: uppercase; letter-spacing: 0.06em; display: var(--chip); }
.mem { font-family: var(--mem-font); font-size: var(--mem-size); fill: var(--mem-fill); white-space: pre; }
.more { font-family: var(--mem-font); font-size: var(--mem-size); fill: var(--muted); }
.summary { font-family: var(--mem-font); font-size: 12px; fill: var(--muted); text-anchor: middle; }

.edge { fill: none; stroke: var(--line); stroke-width: var(--edge-w); }
.edge.dependency { stroke-dasharray: 6 4; }
.elabel { font-family: var(--mem-font); font-size: 10px; fill: var(--muted); }

.mk-hollow { fill: var(--hollow); stroke: var(--line); stroke-width: 1; }
.mk-solid { fill: var(--line); stroke: var(--line); stroke-width: 1; }
.mk-open { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.lm-hollow { fill: var(--hollow); stroke: var(--lit); stroke-width: 1; }
.lm-solid { fill: var(--lit); stroke: var(--lit); stroke-width: 1; }
.lm-open { fill: none; stroke: var(--lit); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

#board[data-detail="far"] .cls, #board[data-detail="far"] .edge-class, #board[data-detail="far"] .pkg-title { display: none; }
#board[data-detail="far"] .pkg-big, #board[data-detail="far"] .pkg-sub { display: block; }
#board:not([data-detail="far"]) .edge-pkg { display: none; }
#board[data-detail="mid"] .members, #board[data-detail="mid"] .elabel { display: none; }
#board[data-detail="close"] .summary { display: none; }
#board[data-detail="far"] .pkg-body { stroke-width: 2; }

#board.has-sel .dimmable { opacity: var(--dim); }
#board.has-sel .dimmable.keep { opacity: 1; }
.cls { cursor: pointer; }
.cls.sel .box { stroke: var(--sel); stroke-width: var(--sel-w); }
.cls.near .box { stroke: var(--lit); stroke-width: var(--lit-w); }
body[data-look="b"] .cls.near .box { stroke: #E7E5DF; }
.edge.lit { stroke: var(--lit); stroke-width: var(--lit-w); }

#bar { position: fixed; left: 0; right: 0; top: 0; height: 40px; background: var(--bg); border-bottom: 1px solid var(--panel-line); z-index: 2; display: flex; align-items: center; gap: 10px; padding: 0 16px; pointer-events: none; font-family: var(--ui-font); }
#bar > * { pointer-events: auto; }
#bar h1 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
body[data-look="b"] #bar h1 { font-family: "Routed Gothic", sans-serif; font-weight: 400; font-size: 16px; letter-spacing: 0.14em; }
.btn { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--panel-line); width: 28px; height: 26px; padding: 0; cursor: pointer; border-radius: 0; }
body[data-look="a"] .btn { border-color: var(--ink); }
.btn.on { background: var(--btn-on-bg); color: var(--btn-on-ink); }
#lookname { color: var(--muted); letter-spacing: 0.06em; }
#zoomread { margin-left: auto; color: var(--muted); }
#hint { color: var(--muted); }

#panel { position: fixed; top: 41px; right: 0; width: 320px; bottom: 28px; background: var(--panel); border-left: 1px solid var(--panel-line); padding: 16px; overflow: auto; display: none; font-family: var(--mem-font); font-size: 12px; line-height: 1.55; }
#panel.open { display: block; }
#panel h2 { margin: 0 0 4px; font-family: var(--name-font); font-weight: var(--name-weight); text-transform: var(--name-tt); letter-spacing: var(--name-ls); font-size: 18px; }
#panel .where { color: var(--muted); margin-bottom: 12px; word-break: break-all; }
#panel h3 { margin: 14px 0 4px; font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; border-top: 1px solid var(--panel-line); padding-top: 8px; }
#panel ul { list-style: none; margin: 0; padding: 0; }
#panel li { white-space: pre-wrap; word-break: break-all; }
#panel .kind { color: var(--muted); }

#mini { position: fixed; left: 16px; bottom: 44px; width: 200px; height: 130px; background: var(--panel); border: 1px solid var(--panel-line); cursor: pointer; }
#mini .mp { fill: none; stroke: var(--line); stroke-width: 1; }
#mini .mc { fill: var(--muted); opacity: 0.55; }
#mini .mc.sel { fill: var(--sel); opacity: 1; }
#mini .mv { fill: none; stroke: var(--sel); stroke-width: 2; }
body[data-look="a"] #mini .mv { stroke: var(--ink); }

#foot { position: fixed; left: 0; right: 0; bottom: 0; height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-top: 1px solid var(--panel-line); background: var(--bg); color: var(--muted); font-size: 11px; font-family: var(--ui-font); }
</style>
</head>

  const r = board.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const mouse = ev.deltaMode !== 0 || (ev.deltaX === 0 && Number.isInteger(ev.deltaY) && Math.abs(ev.deltaY) >= 50);
  if (ev.ctrlKey || ev.metaKey || ev.altKey) zoomAt(mx, my, Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.004)));
  else if (mouse) zoomAt(mx, my, Math.exp(-ev.deltaY * 0.0015 * (ev.deltaMode === 1 ? 20 : 1)));
  else { view.x -= ev.deltaX; view.y -= ev.deltaY; apply(); }
}, { passive: false });

let drag = null;
board.addEventListener("pointerdown", ev => {
  board.setPointerCapture(ev.pointerId);
  drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false, target: ev.target };
});
board.addEventListener("pointermove", ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; board.classList.add("drag"); }
  if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
});
board.addEventListener("pointerup", ev => {
  if (drag && !drag.moved) {
    const hit = drag.target.closest && drag.target.closest(".cls");
    select(hit ? hit.dataset.name : null);
  }
  drag = null;
  board.classList.remove("drag");
});

function drawMini() {
  const W = 200, H = 130, k = Math.min((W - 10) / bounds.w, (H - 10) / bounds.h);
  const ox = (W - bounds.w * k) / 2 - bounds.x * k, oy = (H - bounds.h * k) / 2 - bounds.y * k;
  mini.innerHTML = "";
  mini._k = k; mini._ox = ox; mini._oy = oy;
  pkgs.forEach(p => el("rect", { class: "mp", x: ox + p.x * k, y: oy + p.y * k, width: p.w * k, height: p.h * k }, mini));
  classes.forEach(c => el("rect", { class: "mc" + (c.name === selected ? " sel" : ""), x: ox + c.x * k, y: oy + c.y * k, width: c.w * k, height: c.h * k }, mini));
  const { w, h } = size();
  el("rect", { class: "mv", x: ox + (-view.x / view.s) * k, y: oy + (-view.y / view.s) * k, width: (w / view.s) * k, height: (h / view.s) * k }, mini);
}
mini.addEventListener("pointerdown", ev => {
  const r = mini.getBoundingClientRect();
  const bx = (ev.clientX - r.left - mini._ox) / mini._k, by = (ev.clientY - r.top - mini._oy) / mini._k;
  const { w, h } = size();
  view.x = w / 2 - bx * view.s; view.y = h / 2 - by * view.s;
  apply();
});

async function setLook(k) {
  document.body.dataset.look = k;
  document.querySelectorAll("#bar .btn").forEach(b => b.classList.toggle("on", b.dataset.look === k));
  document.getElementById("lookname").textContent = LOOKS[k];
  try { await document.fonts.ready; } catch (e) {}
  setTabs();
  try { localStorage.setItem("umlLook", k); } catch (e) {}
}
document.querySelectorAll("#bar .btn").forEach(b => b.addEventListener("click", () => setLook(b.dataset.look)));
document.addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === "f") fit();
  else if (ev.key === "t") { const ks = Object.keys(LOOKS); setLook(ks[(ks.indexOf(document.body.dataset.look) + 1) % ks.length]); }
  else if (ev.key === "Escape") select(null);
});
window.addEventListener("resize", drawMini);

let start = "a";
try { start = localStorage.getItem("umlLook") || "a"; } catch (e) {}
setLook(LOOKS[start] ? start : "a");
fit();
(function () {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get("look") && LOOKS[q.get("look")]) setLook(q.get("look"));
  if (q.get("sel") && byName[q.get("sel")]) select(q.get("sel"));
  if (q.get("zoom")) {
    const c = byName[q.get("at") || q.get("sel")] || classes[0];
    const { w, h } = size();
    view.s = parseFloat(q.get("zoom"));
    const open = panel.classList.contains("open") ? 320 : 0;
    view.x = (w - open) / 2 - (c.x + c.w / 2) * view.s;
    view.y = h / 2 - (c.y + c.h / 2) * view.s + (parseFloat(q.get("dy")) || 0);
    apply();
  }
})();
window.__board = { view, select, fit, setLook, apply, classes };
</script>
</body>
