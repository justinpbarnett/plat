[project]
name = "plat"
version = "0.1.0"
description = "Draw a codebase as UML on a read only board. Static analysis first, LLM second."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
plat = "plat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plat"]
